name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: backend (build + testes + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres como service container em vez de Testcontainers.
    # Motivo: o Testcontainers embutido falha no runner ubuntu-26.04
    # ("client version 1.32 is too old. Minimum supported API version is 1.40").
    # O contrato de integracao e o mesmo (ReviewFlowContract); so muda quem sobe o banco.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spacedrep
          POSTGRES_USER: spacedrep
          POSTGRES_PASSWORD: spacedrep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spacedrep -d spacedrep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/spacedrep
      TEST_DB_USER: spacedrep
      TEST_DB_PASSWORD: spacedrep

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes unitarios, testes de integracao e gate de cobertura
        run: mvn -B verify -Pcoverage-gate

      # A analise roda no MESMO job do build de proposito: o SonarCloud precisa do
      # target/site/jacoco/jacoco.xml gerado pelos testes. Em um job separado (runner
      # limpo) ele receberia 0% de cobertura e reprovaria o Quality Gate.
      - name: Verificar configuracao do SonarCloud
        id: sonar_config
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN ausente - analise do SonarCloud pulada (ver docs/adr/ADR-001-sonarcloud.md)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud - analise + Quality Gate
        if: steps.sonar_config.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # qualitygate.wait=true faz o build FALHAR se o Quality Gate reprovar.
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar projeto Angular
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json ainda nao existe (Dia 2) - job pulado"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present
      - name: Testes
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present -- --watch=false --browsers=ChromeHeadless
