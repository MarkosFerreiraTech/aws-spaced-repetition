spring:
  application:
    name: spaced-repetition-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacedrep}
    username: ${DB_USER:spacedrep}
    password: ${DB_PASSWORD:spacedrep_dev_only}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway e a unica fonte de verdade do schema
    open-in-view: false           # evita lazy loading fora da transacao
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  shutdown: graceful

app:
  demo-user-id: ${DEMO_USER_ID:1}
  zone-id: ${APP_ZONE_ID:America/Sao_Paulo}

  jwt:
    # NUNCA use este valor fora do ambiente local. Em CI/producao: GitHub Secrets.
    # Minimo de 32 bytes (HS256 exige chave de 256 bits).
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:45}

  import:
    max-text-length: ${IMPORT_MAX_TEXT_LENGTH:100000}
    rate-limit-per-minute: ${IMPORT_RATE_LIMIT_PER_MINUTE:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.spacedrep: DEBUG
