spring:
  application:
    name: spaced-repetition-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacedrep}
    username: ${DB_USER:spacedrep}
    password: ${DB_PASSWORD:spacedrep_dev_only}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway e a unica fonte de verdade do schema
    open-in-view: false           # evita lazy loading fora da transacao
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  shutdown: graceful

app:
  demo-user-id: ${DEMO_USER_ID:1}
  zone-id: ${APP_ZONE_ID:America/Sao_Paulo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.spacedrep: DEBUG
