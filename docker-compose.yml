# Infra local do MVP. Backend e frontend rodam fora do compose no M0
# (ver README) para preservar hot-reload durante o desenvolvimento.
services:
  postgres:
    image: postgres:16-alpine
    container_name: spacedrep-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-spacedrep}
      POSTGRES_USER: ${DB_USER:-spacedrep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spacedrep_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spacedrep} -d ${DB_NAME:-spacedrep}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
